<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Produce | Woolworths SA</title>
    <meta name="description" content="Shop Woolworths SA fresh produce: fruits, seasonal deals and everyday grocery favourites." />

    <!-- Open Graph / Twitter Cards -->
    <meta property="og:title" content="Fresh Produce | Woolworths SA" />
    <meta property="og:description" content="Shop Woolworths SA fresh produce: fruits, seasonal deals and everyday favourites." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="fruit.html" />
    <meta property="og:image" content="images/mangoes.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fresh Produce | Woolworths SA" />
    <meta name="twitter:description" content="Shop Woolworths SA fresh produce: fruits, seasonal deals and everyday favourites." />
    <meta name="twitter:image" content="images/mangoes.jpg" />

    <link rel="stylesheet" href="style.css">
    <!-- Basic security: Content Security Policy (static-site) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
</head>
<body>

    <section id="fruits-section" class="fruits">

     <h3>Fresh Produce</h3>

        <div class="fruit">

<img src="images/mangoes.jpg" loading="lazy" decoding="async"
class="product-image"
data-name="Fresh Mangoes"
data-price="R10.00 per kg"
data-description="Sweet and juicy fresh mangoes.">
        </div>

       <div class="fruit">
<img src="images/supermarket.jpg" alt="Fresh produce selection"
class="product-image"
data-name="Fresh Produce Selection"
data-price="R10.00 per kg"
data-description="A variety of fresh fruits and vegetables.">
   </div>





   <div class="fruit">
<img src="images/james-yarema.jpg" alt="Fresh seasonal fruit display"
class="product-image"
data-name="Fresh Fruit Display"
data-price="R11.00 per kg"
data-description="Locally sourced seasonal fruit.">
   </div>



   <div class="fruit">
<img src="images/pranjall.jpg" alt="Organic fruit basket"
class="product-image"
data-name="Organic Fruit Basket"
data-price="R6.99 per kg"
data-description="Fresh organic fruit selection.">
 </div>




  <div class="fruit">
<img src="images/matheus-cenali.jpg" alt="Fresh crisp apples"
class="product-image"
data-name="Premium Apples"
data-price="R44.99"
data-description="Fresh crisp apples.">
  </div>



  <div class="fruit"> 
 
<img src="images/mangoes-other-fruits-counter.jpg" alt="Mixed fruit selection at the counter"
class="product-image"
data-name="Fruit Counter Selection"
data-price="R50.99 per kg"
data-description="Fresh fruit available daily.">
 </div>


 
 <div class="fruit">
    
<img src="images/Flavourburst-Blackberries-160-g-6009245712352.jpg" alt="black berries"
class="product-image"
data-name="Flavourburst Blackberries"
data-price="R51.99"
data-description="Fresh blackberries packed with flavour.">
 </div>



 <div class="fruit">
<img src="images/Flavourburst-Blackberries-160-g-6009245712352.jpg" alt="black berries"
class="product-image"
data-name="Flavourburst Blackberries"
data-price="R51.99"
data-description="Fresh blackberries packed with flavour.">
 </div>



 <div class="fruit">
<img src="images/Raspberries red.jpg" alt="Fresh red raspberries"
class="product-image"
data-name="Fresh Raspberries"
data-price="R57.99"
data-description="Fresh red raspberries.">
 </div>



       <div class="fruit">
<img src="images/max-bohme.jpg" alt="Premium fruit collection"
class="product-image"
data-name="Premium Fruit Collection"
data-price="R80.99"
data-description="A premium selection of fresh fruit.">

     </div>


</section>

<!-- Product Modal -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>

        <img id="modalImage" src="" alt="Product Image">

        <h2 id="modalTitle"></h2>

        <p id="modalDescription"></p>

        <p id="modalPrice"></p>
    </div>
</div>

<script defer src="script.js"></script>
</body>
</html>
